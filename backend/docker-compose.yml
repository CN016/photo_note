services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
      TZ: UTC
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ./postgres17_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    env_file:
      - .env
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis7_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -h 127.0.0.1 --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    image: photo-nini-api:local
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # 默认通过 DaoCloud 代理拉取 Docker Hub 镜像；可由启动 Compose 的 shell 环境变量覆盖。
        GO_BASE_IMAGE: "${GO_BASE_IMAGE:-m.daocloud.io/docker.io/library/golang:1.24-alpine}"
        RUNTIME_BASE_IMAGE: "${RUNTIME_BASE_IMAGE:-m.daocloud.io/docker.io/library/alpine:3.22}"
        # Go 模块代理独立于 Docker 镜像代理；任一代理失败时继续尝试后续来源。
        GOPROXY: "${GOPROXY:-https://goproxy.cn|https://proxy.golang.org|direct}"
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_SSLMODE: disable
      REDIS_ADDR: redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8089:8080"
    volumes:
      - ./uploaded_files_data:/var/lib/photo-nini/uploads

volumes:
  redis7_data:
