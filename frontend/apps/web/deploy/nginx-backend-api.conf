# 本文件是 Nginx server 配置片段，请在 Web 站点的 `server {}` 内 include。
# 默认假设 Nginx 与后端 Compose 运行在同一宿主机；容器部署时应改为可达的后端服务地址。

# 兼容手工访问不带尾斜杠的代理根路径。
location = /backendApi {
    return 308 /backendApi/;
}

# proxy_pass 的尾斜杠会去掉匹配的 /backendApi/ 前缀：
# /backendApi/api/v1/auth/login -> http://127.0.0.1:8089/api/v1/auth/login
# /backendApi/healthz           -> http://127.0.0.1:8089/healthz
location ^~ /backendApi/ {
    client_max_body_size 60m;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;

    proxy_pass http://127.0.0.1:8089/;
}
